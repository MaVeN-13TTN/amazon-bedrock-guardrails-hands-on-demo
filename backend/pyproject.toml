[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
# `build/` is the Lambda bundle and `dist/` its zip: vendored third-party code,
# regenerated by scripts/package-backend.sh, and present on any machine that has
# run `terraform apply`.
#
# The repository-root pyproject.toml also excludes these, and that exclusion never
# takes effect — ruff resolves configuration per file from the nearest pyproject,
# so everything under backend/ is governed by *this* file. The root setting looked
# like the fix from V-30 while ruff went on reporting ~7,000 errors in
# dependencies, burying real findings in our own code. Both files carry it now.
extend-exclude = ["build", "dist", "app/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# Calling Depends() in an argument default is the documented FastAPI idiom, not
# the mutable-default bug B008 exists to catch.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body"]
