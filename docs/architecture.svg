<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 620" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0.5 L8 4.5 L0 8.5 z" fill="#5a675e"/>
    </marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0.5 L8 4.5 L0 8.5 z" fill="#2f7d4f"/>
    </marker>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0.5 L8 4.5 L0 8.5 z" fill="#b3352c"/>
    </marker>
  </defs>

  <rect width="1180" height="620" fill="#f5f7f4"/>

  <text x="32" y="38" font-size="19" font-weight="700" fill="#16211c">Kilimo Desk — Bedrock Guardrails as a three-stage pipeline</text>
  <text x="32" y="60" font-size="13" fill="#5a675e">One request, rendered twice. Two of three stages never invoke a foundation model.</text>

  <!-- ================= browser / two views ================= -->
  <rect x="32" y="86" width="286" height="330" rx="10" fill="#fff" stroke="#dce4dd" stroke-width="1.5"/>
  <text x="48" y="110" font-size="12" font-weight="700" fill="#5a675e">BROWSER — static export, no server code</text>

  <!-- member view -->
  <rect x="48" y="124" width="254" height="118" rx="8" fill="#f0fdf4" stroke="#2f7d4f" stroke-width="1.5"/>
  <text x="60" y="145" font-size="13" font-weight="700" fill="#2f7d4f">Member_View</text>
  <text x="60" y="163" font-size="11" fill="#16211c">Landing_Page + Chat_Window</text>
  <text x="60" y="182" font-size="11" fill="#5a675e">the answer or the refusal —</text>
  <text x="60" y="197" font-size="11" fill="#5a675e">and nothing else</text>
  <text x="60" y="220" font-size="10.5" font-style="italic" fill="#2f7d4f">no policy names · no scores</text>
  <text x="60" y="234" font-size="10.5" font-style="italic" fill="#2f7d4f">no stage names · no latency</text>

  <!-- background view -->
  <rect x="48" y="254" width="254" height="82" rx="8" fill="#eff6ff" stroke="#2b5f9e" stroke-width="1.5"/>
  <text x="60" y="275" font-size="13" font-weight="700" fill="#2b5f9e">Background_View</text>
  <text x="60" y="293" font-size="11" fill="#16211c">the same response, unpacked</text>
  <text x="60" y="311" font-size="10.5" fill="#5a675e">per-stage findings · model-invoked</text>
  <text x="60" y="325" font-size="10.5" fill="#5a675e">flag · latency · raw assessment</text>

  <!-- grounding tool -->
  <rect x="48" y="348" width="254" height="52" rx="8" fill="#eff6ff" stroke="#2b5f9e" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="60" y="368" font-size="12" font-weight="700" fill="#2b5f9e">Grounding_Tool</text>
  <text x="60" y="386" font-size="10.5" fill="#5a675e">POST /api/verify direct — engineer</text>

  <text x="48" y="410" font-size="10" fill="#5a675e">one POST /api/ask → both views read one response</text>

  <!-- ================= API ================= -->
  <rect x="352" y="150" width="150" height="120" rx="10" fill="#fff" stroke="#dce4dd" stroke-width="1.5"/>
  <text x="368" y="174" font-size="12" font-weight="700" fill="#5a675e">API</text>
  <text x="368" y="196" font-size="11.5" fill="#16211c">API Gateway</text>
  <text x="368" y="212" font-size="11.5" fill="#16211c">HTTP API</text>
  <text x="368" y="234" font-size="11.5" fill="#16211c">Lambda · FastAPI</text>
  <text x="368" y="250" font-size="10.5" fill="#5a675e">via Mangum</text>
  <text x="368" y="264" font-size="10" fill="#b3352c">no authentication</text>

  <line x1="318" y1="200" x2="346" y2="200" stroke="#5a675e" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- ================= pipeline ================= -->
  <rect x="540" y="86" width="410" height="330" rx="10" fill="#fff" stroke="#dce4dd" stroke-width="1.5"/>
  <text x="556" y="110" font-size="12" font-weight="700" fill="#5a675e">THE PIPELINE — bedrock-runtime</text>

  <!-- stage 1 -->
  <rect x="556" y="124" width="378" height="76" rx="8" fill="#f0fdf4" stroke="#2f7d4f" stroke-width="1.5"/>
  <text x="570" y="145" font-size="13" font-weight="700" fill="#16211c">1 · Screen</text>
  <text x="570" y="163" font-size="11" font-family="ui-monospace,Menlo,monospace" fill="#16211c">ApplyGuardrail(source=INPUT, outputScope=FULL)</text>
  <text x="570" y="181" font-size="11" font-weight="700" fill="#2f7d4f">no model invoked</text>
  <text x="700" y="181" font-size="10.5" fill="#5a675e">denied topics · filters · words · PII</text>
  <text x="570" y="195" font-size="10" fill="#5a675e">blocks, or masks and forwards rewritten text</text>

  <!-- stage 2 -->
  <rect x="556" y="212" width="378" height="76" rx="8" fill="#fffbeb" stroke="#96660f" stroke-width="1.5"/>
  <text x="570" y="233" font-size="13" font-weight="700" fill="#16211c">2 · Answer</text>
  <text x="570" y="251" font-size="11" font-family="ui-monospace,Menlo,monospace" fill="#16211c">Converse + guardrailConfig(trace=enabled)</text>
  <text x="570" y="269" font-size="11" font-weight="700" fill="#96660f">model invoked</text>
  <text x="700" y="269" font-size="10.5" fill="#5a675e">guardContent wraps only the user span</text>
  <text x="570" y="283" font-size="10" fill="#5a675e">falls back to a labelled canned answer if unavailable</text>

  <!-- stage 3 -->
  <rect x="556" y="300" width="378" height="76" rx="8" fill="#f0fdf4" stroke="#2f7d4f" stroke-width="1.5"/>
  <text x="570" y="321" font-size="13" font-weight="700" fill="#16211c">3 · Verify</text>
  <text x="570" y="339" font-size="11" font-family="ui-monospace,Menlo,monospace" fill="#16211c">ApplyGuardrail(source=OUTPUT)</text>
  <text x="570" y="357" font-size="11" font-weight="700" fill="#2f7d4f">no model invoked</text>
  <text x="700" y="357" font-size="10.5" fill="#5a675e">grounding ≥ 0.7 · relevance ≥ 0.7</text>
  <text x="570" y="371" font-size="10" fill="#5a675e">reference document supplied inline — no knowledge base</text>

  <text x="556" y="398" font-size="10.5" fill="#b3352c">A block at stage 1 halts the request: stages 2 and 3 never run, and cost nothing.</text>

  <line x1="502" y1="180" x2="550" y2="160" stroke="#5a675e" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="745" y1="200" x2="745" y2="208" stroke="#5a675e" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="745" y1="288" x2="745" y2="296" stroke="#5a675e" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- ================= guardrail resource ================= -->
  <rect x="978" y="124" width="170" height="252" rx="10" fill="#fff" stroke="#2b5f9e" stroke-width="2"/>
  <text x="992" y="147" font-size="12" font-weight="700" fill="#2b5f9e">GUARDRAIL</text>
  <text x="992" y="163" font-size="10" fill="#5a675e">one resource, 5 policies</text>

  <text x="992" y="188" font-size="10.5" fill="#16211c">▪ 3 denied topics</text>
  <text x="992" y="206" font-size="10.5" fill="#16211c">▪ 6 content filters in</text>
  <text x="1002" y="220" font-size="10" fill="#5a675e">5 out — PROMPT_ATTACK</text>
  <text x="1002" y="232" font-size="10" fill="#5a675e">is input-only</text>
  <text x="992" y="250" font-size="10.5" fill="#16211c">▪ 2 words + profanity</text>
  <text x="992" y="268" font-size="10.5" fill="#16211c">▪ 2 PII + 2 regexes</text>
  <text x="1002" y="282" font-size="10" fill="#5a675e">ANONYMIZE on input</text>
  <text x="992" y="300" font-size="10.5" fill="#16211c">▪ grounding + relevance</text>

  <text x="992" y="326" font-size="10" fill="#5a675e">tier: CLASSIC | STANDARD</text>
  <text x="992" y="340" font-size="10" fill="#5a675e">version: DRAFT | pinned</text>
  <text x="992" y="360" font-size="9.5" font-style="italic" fill="#2b5f9e">billed per 1,000 text units,</text>
  <text x="992" y="371" font-size="9.5" font-style="italic" fill="#2b5f9e">per policy enabled</text>

  <line x1="938" y1="162" x2="972" y2="180" stroke="#2b5f9e" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="938" y1="250" x2="972" y2="250" stroke="#2b5f9e" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="938" y1="338" x2="972" y2="320" stroke="#2b5f9e" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- ================= source of truth ================= -->
  <rect x="352" y="300" width="150" height="76" rx="10" fill="#fff" stroke="#dce4dd" stroke-width="1.5"/>
  <text x="366" y="322" font-size="11" font-weight="700" fill="#5a675e">ONE DEFINITION</text>
  <text x="366" y="340" font-size="10.5" font-family="ui-monospace,Menlo,monospace" fill="#16211c">shared/</text>
  <text x="366" y="354" font-size="10.5" font-family="ui-monospace,Menlo,monospace" fill="#16211c">scenario.json</text>
  <text x="366" y="370" font-size="9.5" fill="#5a675e">Terraform + app read it</text>

  <line x1="427" y1="298" x2="427" y2="274" stroke="#5a675e" stroke-width="1.3" stroke-dasharray="3 3" marker-end="url(#a)"/>
  <line x1="502" y1="330" x2="1060" y2="330" stroke="#dce4dd" stroke-width="0"/>

  <!-- ================= lab path ================= -->
  <rect x="32" y="446" width="918" height="140" rx="10" fill="#fff" stroke="#2f7d4f" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="48" y="470" font-size="12" font-weight="700" fill="#2f7d4f">THE LAB PATH — same guardrail, no deployed infrastructure</text>

  <rect x="48" y="484" width="196" height="86" rx="8" fill="#f0fdf4" stroke="#2f7d4f" stroke-width="1.2"/>
  <text x="60" y="504" font-size="11.5" font-weight="700" fill="#16211c">lab doctor</text>
  <text x="60" y="521" font-size="10" fill="#5a675e">checks prerequisites first;</text>
  <text x="60" y="534" font-size="10" fill="#5a675e">tells an SCP deny apart</text>
  <text x="60" y="547" font-size="10" fill="#5a675e">from a missing IAM grant</text>
  <text x="60" y="563" font-size="9.5" font-style="italic" fill="#2f7d4f">creates nothing</text>

  <rect x="258" y="484" width="196" height="86" rx="8" fill="#f0fdf4" stroke="#2f7d4f" stroke-width="1.2"/>
  <text x="270" y="504" font-size="11.5" font-weight="700" fill="#16211c">lab evaluate</text>
  <text x="270" y="521" font-size="10" fill="#5a675e">one prompt, every finding,</text>
  <text x="270" y="534" font-size="10" fill="#5a675e">the forwarded text</text>
  <text x="270" y="563" font-size="9.5" font-style="italic" fill="#2f7d4f">ApplyGuardrail only</text>

  <rect x="468" y="484" width="196" height="86" rx="8" fill="#f0fdf4" stroke="#2f7d4f" stroke-width="1.2"/>
  <text x="480" y="504" font-size="11.5" font-weight="700" fill="#16211c">lab conformance</text>
  <text x="480" y="521" font-size="10" fill="#5a675e">the whole case set, N reps,</text>
  <text x="480" y="534" font-size="10" fill="#5a675e">JSONL records out</text>
  <text x="480" y="563" font-size="9.5" font-style="italic" fill="#2f7d4f">every measured number</text>

  <rect x="678" y="484" width="256" height="86" rx="8" fill="#f0fdf4" stroke="#2f7d4f" stroke-width="1.2"/>
  <text x="690" y="504" font-size="11.5" font-weight="700" fill="#16211c">lab checkpoint · lab teardown</text>
  <text x="690" y="521" font-size="10" fill="#5a675e">verify a module; then remove</text>
  <text x="690" y="534" font-size="10" fill="#5a675e">everything, without Terraform state</text>
  <text x="690" y="563" font-size="9.5" font-style="italic" fill="#2f7d4f">one billable resource, under $0.05</text>

  <line x1="244" y1="527" x2="252" y2="527" stroke="#2f7d4f" stroke-width="1.4" marker-end="url(#ag)"/>
  <line x1="454" y1="527" x2="462" y2="527" stroke="#2f7d4f" stroke-width="1.4" marker-end="url(#ag)"/>
  <line x1="664" y1="527" x2="672" y2="527" stroke="#2f7d4f" stroke-width="1.4" marker-end="url(#ag)"/>

  <line x1="1010" y1="380" x2="1010" y2="470" stroke="#2b5f9e" stroke-width="1.4" stroke-dasharray="4 3"/>
  <line x1="1010" y1="470" x2="956" y2="500" stroke="#2b5f9e" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="1022" y="424" font-size="9.5" fill="#2b5f9e">the lab uses</text>
  <text x="1022" y="437" font-size="9.5" fill="#2b5f9e">the same</text>
  <text x="1022" y="450" font-size="9.5" fill="#2b5f9e">guardrail</text>

  <text x="32" y="606" font-size="10" fill="#5a675e">Region-agnostic: aws_region derives the guardrail profile, model ARNs and IAM. Any Region where Bedrock Guardrails runs.</text>
</svg>
