[tool.pytest.ini_options]
pythonpath = [".", "backend"]
testpaths = ["lab/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
# backend/build is the Lambda bundle: vendored third-party code, regenerated by
# scripts/package-backend.sh. Without this, any `terraform apply` leaves ~7,000
# lint errors in dependencies behind and buries real findings in our own code.
extend-exclude = ["backend/build", "backend/dist", "backend/app/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
